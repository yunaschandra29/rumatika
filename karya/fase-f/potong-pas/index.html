<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potong Pas — Bengkel Poros Kota</title>
<style>
:root{
  --baja:#5A6472; --bajaT:#3B4149; --bajaM:#8B94A3;
  --kuningan:#C9962C; --kuninganM:#F2B544;
  --oranye:#E0662B; --oranyeT:#B84F1E;
  --cyan:#4FA8C9; --cyanM:#8FCBE0;
  --biru:#1C3A4B; --biruT:#12283A; --biruG:#0C1C28;
  --kertas:#E9EFF2; --kertasT:#D5E0E6; --tinta:#1D2A33; --tintaM:#4E5D68;
  --hijau:#3E9B63; --hijauM:#6FCF97;
  --f-judul:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif;
  --f-isi:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--biruG);overflow:hidden;font-family:var(--f-isi);color:var(--tinta)}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#16303F,#08131B)}
#stage{width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative;overflow:hidden;container-type:inline-size;background:var(--biru);
  background-image:linear-gradient(rgba(124,198,224,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(124,198,224,.07) 1px,transparent 1px);background-size:2.5cqw 2.5cqw}
.layar{position:absolute;inset:0;display:none;flex-direction:column}
.layar.on{display:flex}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:.25cqw solid var(--kuninganM);outline-offset:.2cqw}
button:disabled{cursor:not-allowed;opacity:.45}
.tb{font-family:var(--f-judul);font-size:1.35cqw;font-weight:700;padding:.85cqw 2cqw;border-radius:.5cqw;background:var(--oranye);color:#fff;box-shadow:0 .3cqw 0 var(--oranyeT);transition:transform .08s}
.tb:active:not(:disabled){transform:translateY(.25cqw);box-shadow:0 .05cqw 0 var(--oranyeT)}
.tb.kedua{background:transparent;color:var(--cyanM);box-shadow:inset 0 0 0 .15cqw var(--cyan)}
.tb.kecil{font-size:1.05cqw;padding:.55cqw 1.2cqw}
.tb.gelap{background:var(--bajaT);color:var(--kertas);box-shadow:0 .3cqw 0 #22272D}
.ikon{width:3.2cqw;height:3.2cqw;border-radius:50%;background:rgba(255,255,255,.08);color:var(--kertas);font-size:1.4cqw;display:grid;place-items:center}
/* judul bar */
.bar{display:flex;align-items:center;gap:1.2cqw;padding:1.2cqw 2cqw;color:var(--kertas);border-bottom:.12cqw solid rgba(124,198,224,.25)}
.bar h2{font-family:var(--f-judul);font-size:1.7cqw;font-weight:700;letter-spacing:.02em}
.bar .kiri{display:flex;align-items:center;gap:1cqw;flex:1;min-width:0}
.bar .sub{font-size:1.05cqw;color:var(--cyanM)}
/* beranda */
#L-beranda{flex-direction:row;align-items:stretch}
#L-beranda .kiriB{flex:0 0 44%;padding:5cqw 0 4cqw 5cqw;display:flex;flex-direction:column;justify-content:center;color:var(--kertas);position:relative;z-index:2}
.judulB{font-family:var(--f-judul);font-weight:800;font-size:8.2cqw;line-height:.9;color:var(--kuninganM);letter-spacing:-.01em}
.potongGaris{position:relative;height:1.6cqw;margin:1.2cqw 0 1.4cqw;width:30cqw}
.potongGaris::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:.25cqw dashed var(--cyanM)}
.potongGaris span{position:absolute;top:-.55cqw;left:0;font-size:2cqw;color:var(--oranye);animation:gunting 3.6s ease-in-out infinite}
@keyframes gunting{0%{left:0}60%{left:27cqw}100%{left:27cqw}}
.subB{font-family:var(--f-judul);font-size:2.4cqw;font-weight:600;color:var(--kertas)}
.tagB{font-size:1.35cqw;line-height:1.55;color:var(--cyanM);max-width:32cqw;margin-top:1.2cqw}
.tombolB{display:flex;gap:1cqw;margin-top:2.6cqw;flex-wrap:wrap}
#L-beranda .kananB{flex:1;display:grid;place-items:center;position:relative}
#L-beranda .kananB svg{width:95%}
.latarFoto{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
#L-beranda.berfoto .latarFoto{opacity:1}
#L-beranda.berfoto::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,19,27,.92) 0%,rgba(8,19,27,.8) 34%,rgba(8,19,27,.25) 55%,transparent 70%)}
#L-beranda.berfoto .judulB{text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.5)}
/* mesin */
.mesin .hantu{opacity:.6}
.mesin .hantu *{fill:none!important;stroke:#7CC6E0!important;stroke-width:2!important;stroke-dasharray:6 5}
.mesin .baru{animation:kilau 1.4s ease-in-out 3}
@keyframes kilau{50%{filter:drop-shadow(0 0 10px #F2B544) brightness(1.3)}}
.mesin .roda{transform-origin:530px 235px}
.mesin.berputar .roda{animation:putar 6s linear infinite}
.mesin.berputar .rodakiri{transform-origin:110px 415px;animation:putar 2s linear infinite}
.putarPelan .roda{transform-origin:530px 235px;animation:putar 40s linear infinite}
@keyframes putar{to{transform:rotate(-360deg)}}
/* muat */
#L-muat{align-items:center;justify-content:center;gap:1.6cqw;color:var(--kertas)}
.muatBar{width:40cqw;height:1.2cqw;border-radius:1cqw;background:var(--biruT);overflow:hidden;box-shadow:inset 0 0 0 .1cqw rgba(124,198,224,.35)}
.muatBar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--kuningan) 0 1cqw,var(--kuninganM) 1cqw 2cqw);transition:width .15s}
/* identitas */
#L-identitas{align-items:center;justify-content:center}
.kartuId{width:46cqw;background:var(--kertas);border-radius:1cqw;padding:2.6cqw 3cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.35);position:relative}
.kartuId::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1cqw;background:repeating-linear-gradient(180deg,var(--oranye) 0 1.5cqw,var(--bajaT) 1.5cqw 3cqw);border-radius:1cqw 0 0 1cqw}
.kartuId h2{font-family:var(--f-judul);font-size:2.4cqw;color:var(--biru)}
.kartuId p{font-size:1.15cqw;color:var(--tintaM);margin:.4cqw 0 1.6cqw}
.medan{display:flex;flex-direction:column;gap:.4cqw;margin-bottom:1.2cqw}
.medan label{font-size:1.05cqw;font-weight:600;color:var(--tintaM)}
.medan input{font-size:1.4cqw;padding:.8cqw 1cqw;border-radius:.5cqw;border:.15cqw solid var(--kertasT);background:#fff;font-family:inherit}
.galat{color:var(--oranyeT);font-size:1.05cqw;min-height:1.4cqw}
/* bengkel */
.isiBengkel{flex:1;display:flex;min-height:0}
.panggungMesin{flex:0 0 58%;display:flex;flex-direction:column;justify-content:center;padding:1cqw 1.5cqw 1.5cqw 2cqw}
.panggungMesin svg{width:100%}
.ketMesin{color:var(--cyanM);font-size:1.1cqw;margin-top:.6cqw}
.jalur{flex:1;overflow-y:auto;padding:1.2cqw 2cqw 1.5cqw 1cqw;display:flex;flex-direction:column;gap:.7cqw}
.tiketK{display:flex;align-items:center;gap:1.1cqw;padding:.85cqw 1.1cqw;border-radius:.6cqw;background:rgba(233,239,242,.06);color:var(--kertas);text-align:left;box-shadow:inset 0 0 0 .12cqw rgba(124,198,224,.2);width:100%}
.tiketK .no{flex:0 0 2.6cqw;height:2.6cqw;border-radius:50%;display:grid;place-items:center;font-family:var(--f-judul);font-weight:700;font-size:1.25cqw;background:var(--biruT);color:var(--cyanM);box-shadow:inset 0 0 0 .12cqw var(--cyan)}
.tiketK .tk{flex:1;min-width:0}
.tiketK .tk b{display:block;font-family:var(--f-judul);font-size:1.3cqw;font-weight:700}
.tiketK .tk small{font-size:.98cqw;color:var(--cyanM)}
.tiketK .st{font-size:1.1cqw;white-space:nowrap;color:var(--kuninganM)}
.tiketK.siap{background:var(--kertas);color:var(--tinta);box-shadow:0 .3cqw 0 var(--oranye)}
.tiketK.siap .no{background:var(--oranye);color:#fff;box-shadow:none}
.tiketK.siap .tk small{color:var(--tintaM)}
.tiketK.siap .st{color:var(--oranyeT);font-weight:700}
.tiketK.selesai .no{background:var(--kuningan);color:var(--biru);box-shadow:none}
.tiketK.kunci{opacity:.5}
.tiketK.latih .no{border-radius:.4cqw}
/* dialog */
.lapis{position:absolute;inset:0;background:rgba(8,19,27,.72);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:2cqw}
.lapis.on{display:flex}
.dialog{width:70cqw;display:flex;gap:1.6cqw;align-items:flex-end;margin-bottom:1cqw}
.avatar{flex:0 0 9cqw;height:9cqw;border-radius:50%;overflow:hidden;background:var(--biruT);box-shadow:0 0 0 .3cqw var(--kertas)}
.avatar img,.avatar svg{width:100%;height:100%;object-fit:cover;display:block}
.gelembung{flex:1;background:var(--kertas);border-radius:1cqw;padding:1.6cqw 2cqw;position:relative;min-height:9cqw}
.gelembung .siapa{font-family:var(--f-judul);font-weight:700;font-size:1.3cqw;color:var(--oranyeT);margin-bottom:.4cqw}
.gelembung .siapa small{font-family:var(--f-isi);font-weight:400;color:var(--tintaM);font-size:1cqw;margin-left:.6cqw}
.gelembung p{font-size:1.45cqw;line-height:1.5}
.gelembung .aksi{display:flex;justify-content:flex-end;margin-top:1cqw;gap:.8cqw}
/* tiket */
.isiTiket{flex:1;display:flex;min-height:0}
.meja{flex:0 0 52%;position:relative;padding:1cqw 1cqw 1cqw 2cqw;display:flex;align-items:center}
.meja .bp-svg{width:100%;height:auto;border-radius:.6cqw;box-shadow:inset 0 0 0 .12cqw rgba(124,198,224,.35);background:rgba(12,28,40,.45)}
.bp-svg .penanda{cursor:pointer}
.panel{flex:1;background:var(--kertas);margin:1cqw 2cqw 1.5cqw 0;border-radius:.8cqw;padding:1.6cqw 1.8cqw;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.panel .mat{font-size:1cqw;color:var(--tintaM);font-weight:600}
.panel .tanya{font-size:1.45cqw;line-height:1.5;margin:.5cqw 0 1.1cqw;font-weight:500}
.langkahT{display:flex;gap:.5cqw;align-items:center}
.langkahT i{width:2.2cqw;height:.55cqw;border-radius:.3cqw;background:rgba(124,198,224,.25)}
.langkahT i.on{background:var(--kuninganM)} .langkahT i.ok{background:var(--hijauM)}
.aksiPanel{display:flex;gap:.8cqw;margin-top:auto;padding-top:1cqw;justify-content:flex-end}
.umpan{border-radius:.6cqw;padding:1cqw 1.2cqw;font-size:1.2cqw;line-height:1.5;margin-top:1cqw;display:none}
.umpan.on{display:block}
.umpan b{font-family:var(--f-judul)}
.umpan.benar{background:#D7F0E0;color:#1F5A37}
.umpan.coba{background:#FBEBCB;color:#6B4A0C}
.umpan.petunjuk{background:#D6ECF5;color:#194A5E}
.umpan.kunci{background:#FBDCCB;color:#7A3212}
.umpan.info{background:var(--kertasT);color:var(--tinta)}
/* input angka */
.masukan{display:flex;gap:.6cqw;align-items:center}
.masukan input{flex:1;font-size:1.7cqw;font-family:var(--f-judul);padding:.7cqw 1cqw;border-radius:.5cqw;border:.15cqw solid var(--kertasT);background:#fff}
.masukan .sat{font-size:1.3cqw;color:var(--tintaM);min-width:3cqw}
.papan{display:flex;gap:.45cqw;margin-top:.7cqw;flex-wrap:wrap}
.papan button{font-family:var(--f-judul);font-size:1.3cqw;min-width:3.4cqw;padding:.5cqw .8cqw;border-radius:.45cqw;background:var(--biru);color:var(--kertas)}
.baca{font-size:1.05cqw;color:var(--tintaM);margin-top:.6cqw;min-height:1.5cqw}
/* pilihan ganda */
.opsi{display:flex;flex-direction:column;gap:.6cqw}
.opsi button{text-align:left;font-size:1.25cqw;padding:.85cqw 1.1cqw;border-radius:.5cqw;background:#fff;box-shadow:inset 0 0 0 .13cqw var(--kertasT);line-height:1.35}
.opsi button.pilih{box-shadow:inset 0 0 0 .22cqw var(--oranye);background:#FFF4EC}
.opsi button.coret{text-decoration:line-through;opacity:.5}
.opsi button.tepat{box-shadow:inset 0 0 0 .22cqw var(--hijau);background:#E4F5EA}
/* label, urut, jodoh */
.chips{display:flex;flex-wrap:wrap;gap:.5cqw;margin-bottom:.9cqw}
.chip{font-size:1.1cqw;font-weight:600;padding:.5cqw .9cqw;border-radius:2cqw;background:var(--biru);color:var(--kertas)}
.chip.pilih{background:var(--oranye)}
.chip.pakai{opacity:.35}
.slotG{display:grid;grid-template-columns:1fr 1fr;gap:.45cqw}
.slot{display:flex;align-items:center;gap:.6cqw;font-size:1.1cqw;padding:.45cqw .7cqw;border-radius:.45cqw;background:#fff;box-shadow:inset 0 0 0 .12cqw var(--kertasT);text-align:left}
.slot .n{flex:0 0 1.9cqw;height:1.9cqw;border-radius:50%;background:var(--biru);color:var(--kuninganM);display:grid;place-items:center;font-weight:700;font-family:var(--f-judul)}
.slot .v{color:var(--tintaM)} .slot.isi .v{color:var(--tinta);font-weight:600}
.slot.tepat{box-shadow:inset 0 0 0 .18cqw var(--hijau)} .slot.meleset{box-shadow:inset 0 0 0 .18cqw var(--oranye)}
.urutan{display:flex;flex-direction:column;gap:.45cqw}
.urutan button{text-align:left;font-size:1.12cqw;line-height:1.4;padding:.6cqw .9cqw;border-radius:.45cqw;background:#fff;box-shadow:inset 0 0 0 .12cqw var(--kertasT);display:flex;gap:.7cqw}
.urutan button .n{flex:0 0 1.9cqw;height:1.9cqw;border-radius:50%;background:var(--kertasT);display:grid;place-items:center;font-weight:700}
.urutan button.dipilih .n{background:var(--oranye);color:#fff}
.jodoh{display:grid;grid-template-columns:1fr 1.6fr;gap:.5cqw 1cqw}
.jodoh button{font-size:1.1cqw;padding:.6cqw .8cqw;border-radius:.45cqw;background:#fff;box-shadow:inset 0 0 0 .12cqw var(--kertasT);text-align:left;line-height:1.35}
.jodoh button.pilih{box-shadow:inset 0 0 0 .22cqw var(--oranye)}
.jodoh button[data-p]{color:#fff}
/* alat ukur */
.ukur{position:absolute;left:3cqw;right:2cqw;bottom:1.6cqw;background:rgba(12,28,40,.92);border-radius:.6cqw;padding:.8cqw 1.2cqw;color:var(--kertas);font-size:1.05cqw;display:none}
.ukur.on{display:block}
.ukur .skala{position:relative;height:1.1cqw;margin-top:.5cqw;border-radius:.6cqw;background:linear-gradient(90deg,#C75B3A,#F2B544 42%,#6FCF97 48%,#6FCF97 52%,#F2B544 58%,#C75B3A)}
.ukur .jarum{position:absolute;top:-.4cqw;width:.35cqw;height:1.9cqw;background:#fff;border-radius:.2cqw;transition:left .5s}
.ukur .ujung{display:flex;justify-content:space-between;color:var(--cyanM);font-size:.9cqw;margin-top:.3cqw}
/* materi */
.isiMateri{flex:1;display:flex;min-height:0}
.isiMateri .meja{flex-basis:56%}
.panel h3{font-family:var(--f-judul);font-size:2cqw;color:var(--biru);margin-bottom:1cqw}
.panel .para{font-size:1.35cqw;line-height:1.6;margin-bottom:.9cqw}
/* uji putar */
.ujiKotak{background:var(--biruT);border-radius:1cqw;width:74cqw;padding:1.6cqw 2cqw;align-self:center;color:var(--kertas);box-shadow:0 0 0 .15cqw var(--cyan)}
.ujiKotak h3{font-family:var(--f-judul);font-size:2.2cqw;color:var(--kuninganM)}
.ujiKotak .isi{display:flex;gap:2cqw;align-items:center}
.ujiGambar{flex:0 0 44cqw;width:44cqw}.ujiGambar svg{width:100%;display:block}
.ujiKotak p{font-size:1.35cqw;line-height:1.55;color:var(--kertas)}
.bintang{font-size:2.4cqw;letter-spacing:.3cqw;color:var(--kuninganM);margin:.6cqw 0}
.bintang .mati{color:rgba(242,181,68,.25)}
.garisPotong{height:.3cqw;background:repeating-linear-gradient(90deg,var(--cyanM) 0 1cqw,transparent 1cqw 1.8cqw);margin:.8cqw 0 1.2cqw;position:relative}
.garisPotong::after{content:"✂";position:absolute;top:-1.1cqw;font-size:1.8cqw;color:var(--oranye);animation:gunting2 1.2s ease-out forwards}
@keyframes gunting2{from{left:0}to{left:calc(100% - 2cqw)}}
/* laporan & tentang */
.gulir{flex:1;overflow-y:auto;padding:1.5cqw 2cqw 2cqw}
.lembar{background:var(--kertas);border-radius:.8cqw;padding:2cqw 2.4cqw;max-width:86cqw;margin:0 auto}
.lembar h3{font-family:var(--f-judul);font-size:1.7cqw;color:var(--biru);margin:1.2cqw 0 .6cqw}
.lembar h3:first-child{margin-top:0}
.lembar p,.lembar li{font-size:1.2cqw;line-height:1.6}
.lembar ul{padding-left:1.6cqw}
.tabel{width:100%;border-collapse:collapse;font-size:1.1cqw}
.tabel th,.tabel td{padding:.55cqw .7cqw;text-align:left;border-bottom:.1cqw solid var(--kertasT)}
.tabel th{font-weight:700;color:var(--tintaM)}
.predikat{font-family:var(--f-judul);font-size:3cqw;font-weight:800;color:var(--oranyeT);line-height:1.1}
.hasilKuis{text-align:center;padding:2cqw}

/* tujuan */
.isiTujuan{flex:1;display:flex;gap:2cqw;padding:1.6cqw 2.4cqw 2cqw;min-height:0}
.daftarTujuan{flex:1.35;align-self:flex-start;max-height:100%;background:var(--kertas);border-radius:.8cqw;padding:1.8cqw 2.2cqw;overflow-y:auto}
.pengantar{font-size:1.3cqw;color:var(--tintaM);margin-bottom:1cqw}
.daftarTujuan ol{list-style:none;counter-reset:t;display:flex;flex-direction:column;gap:.8cqw}
.daftarTujuan li{counter-increment:t;display:flex;gap:1.1cqw;align-items:flex-start;font-size:1.28cqw;line-height:1.5}
.daftarTujuan li::before{content:counter(t);flex:0 0 2.3cqw;height:2.3cqw;border-radius:50%;background:var(--biru);color:var(--kuninganM);display:grid;place-items:center;font-family:var(--f-judul);font-weight:700}
.daftarTujuan .tt{flex:1}
.daftarTujuan .tk{font-size:.95cqw;font-weight:700;color:var(--oranyeT);white-space:nowrap;padding-top:.3cqw}
.caraKerja{flex:1;color:var(--kertas);display:flex;flex-direction:column}
.caraKerja h3{font-family:var(--f-judul);font-size:1.8cqw;color:var(--kuninganM);margin-bottom:1cqw}
.alur{list-style:none;counter-reset:a;display:flex;flex-direction:column;gap:.7cqw;margin-bottom:auto}
.alur li{counter-increment:a;display:grid;grid-template-columns:2.4cqw 1fr;column-gap:1cqw;padding:.8cqw 1cqw;border-radius:.6cqw;box-shadow:inset 0 0 0 .12cqw rgba(124,198,224,.3)}
.alur li::before{content:counter(a);grid-row:span 2;width:2.4cqw;height:2.4cqw;border-radius:.4cqw;background:var(--oranye);color:#fff;display:grid;place-items:center;font-family:var(--f-judul);font-weight:700}
.alur b{font-family:var(--f-judul);font-size:1.35cqw}
.alur span{font-size:1.1cqw;color:var(--cyanM);line-height:1.45}
.caraKerja .tb{align-self:flex-end;margin-top:1.4cqw}
/* papan order */
.papanOrder{flex:1;display:grid;grid-template-columns:19% 1fr 1.25fr 1fr;gap:1.4cqw;padding:1.4cqw 2cqw 1.8cqw;min-height:0;

<script>
/* ===== MESIN MATEMATIKA ===== */
const M = (() => {
  // Sederhanakan √n menjadi a√b
  function akar(n){
    let a = 1, b = n;
    for (let k = Math.floor(Math.sqrt(n)); k >= 2; k--){
      if (b % (k*k) === 0){ a *= k; b = b/(k*k); break; }
    }
    // ulangi sampai tidak bisa disederhanakan
    let again = true;
    while (again){
      again = false;
      for (let k = Math.floor(Math.sqrt(b)); k >= 2; k--){
        if (b % (k*k) === 0){ a *= k; b = b/(k*k); again = true; break; }
      }
    }
    return { a, b }; // nilai = a*√b
  }
  // Teks akar: koef * √n  → "12√3", "15", "√93"
  function teksAkar(n, koef = 1){
    const s = akar(n);
    const a = s.a * koef;
    if (s.b === 1) return String(a);
    return (a === 1 ? '' : String(a)) + '√' + s.b;
  }
  function koma(x, d = 2){
    const r = Math.round(x * Math.pow(10, d)) / Math.pow(10, d);
    let s = r.toFixed(d);
    s = s.replace(/\.?0+$/, '');
    return s.replace('.', ',');
  }
  // Teks koefisien π: 14 → "14π", 1 → "π"
  function teksPi(k){
    if (k === 1) return 'π';
    return String(k).replace('.', ',') + 'π';
  }

  // ---------- Parser ekspresi jawaban ----------
  function normal(str){
    let s = String(str || '').toLowerCase();
    s = s.replace(/[cd]m²|[cd]m2|[cd]m\^2|m²|derajat|[cd]m|°|satuan/g, '');
    s = s.replace(/\s+/g, '');
    s = s.replace(/sqrt|akar|v(?=\d|\()/g, '√');
    s = s.replace(/pi/g, 'π');
    s = s.replace(/[×x·]/g, '*').replace(/[÷:]/g, '/');
    s = s.replace(/[−–—]/g, '-');
    s = s.replace(/²/g, '^2').replace(/³/g, '^3');
    // koma desimal → titik (angka,angka)
    s = s.replace(/(\d),(\d)/g, '$1.$2');
    return s;
  }
  function tokenize(s){
    const t = []; let i = 0;
    while (i < s.length){
      const c = s[i];
      if (/[0-9.]/.test(c)){
        let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const num = s.slice(i, j);
        if ((num.match(/\./g) || []).length > 1) throw new Error('angka');
        t.push({ k: 'n', v: parseFloat(num) }); i = j; continue;
      }
      if ('+-*/^()√π'.includes(c)){ t.push({ k: c }); i++; continue; }
      throw new Error('karakter ' + c);
    }
    return t;
  }
  function parse(str){
    const toks = tokenize(normal(str));
    if (!toks.length) throw new Error('kosong');
    let p = 0;
    const peek = () => toks[p], take = () => toks[p++];
    const startsFactor = tk => tk && (tk.k === 'n' || tk.k === 'π' || tk.k === '√' || tk.k === '(');
    function expr(){
      let v = term();
      while (peek() && (peek().k === '+' || peek().k === '-')){
        const op = take().k; const r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }
    function term(){
      let v = power();
      for (;;){
        const tk = peek();
        if (tk && (tk.k === '*' || tk.k === '/')){
          take(); const r = power();
          v = tk.k === '*' ? v * r : v / r;
        } else if (startsFactor(tk)){
          v = v * power();
        } else break;
      }
      return v;
    }
    function power(){
      let b = unary();
      if (peek() && peek().k === '^'){ take(); const e = power(); b = Math.pow(b, e); }
      return b;
    }
    function unary(){
      if (peek() && peek().k === '-'){ take(); return -unary(); }
      if (peek() && peek().k === '+'){ take(); return unary(); }
      return primary();
    }
    function primary(){
      const tk = take();
      if (!tk) throw new Error('akhir');
      if (tk.k === 'n') return tk.v;
      if (tk.k === 'π') return Math.PI;
      if (tk.k === '√'){ const v = primary(); if (v < 0) throw new Error('akar negatif'); return Math.sqrt(v); }
      if (tk.k === '('){ const v = expr(); const c = take(); if (!c || c.k !== ')') throw new Error('kurung'); return v; }
      throw new Error('token');
    }
    const v = expr();
    if (p !== toks.length) throw new Error('sisa');
    if (!isFinite(v)) throw new Error('tak hingga');
    return v;
  }
  // Toleransi: menerima π≈3,14 atau 22/7 dan pembulatan wajar
  function cocok(x, target){
    const tol = Math.max(0.006 * Math.abs(target), 0.05);
    return Math.abs(x - target) <= tol;
  }
  return { akar, teksAkar, koma, teksPi, parse, cocok, normal };
})();
if (typeof module !== 'undefined') module.exports = M;

/* ===== GAMBAR SVG MEJA KERJA ===== */
const G = (() => {
  const W = 600, H = 440;
  const rad = d => d * Math.PI / 180;
  // titik pada lingkaran, sudut matematis (berlawanan jarum jam, y ke atas)
  const pt = (cx, cy, r, deg) => [cx + r * Math.cos(rad(deg)), cy - r * Math.sin(rad(deg))];
  const f = n => Math.round(n * 10) / 10;
  const C = {
    garis: '#CFE3EC', tipis: 'rgba(207,227,236,.35)', kuning: '#F2B544', oranye: '#F07A3C',
    hijau: '#6FCF97', cyan: '#7CC6E0', putih: '#F4F8FA', isiK: 'rgba(242,181,68,.28)', isiO: 'rgba(240,122,60,.30)', isiC: 'rgba(124,198,224,.25)'
  };
  function kertas(inner){
    let grid = '';
    for (let x = 0; x <= W; x += 20) grid += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="rgba(124,198,224,${x % 100 === 0 ? .16 : .07})"/>`;
    for (let y = 0; y <= H; y += 20) grid += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="rgba(124,198,224,${y % 100 === 0 ? .16 : .07})"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="bp-svg" font-family="Bahnschrift, 'Segoe UI', system-ui, sans-serif">${grid}${inner}</svg>`;
  }
  const lingkaran = (cx, cy, r, o = {}) => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${o.isi || 'none'}" stroke="${o.warna || C.garis}" stroke-width="${o.tebal || 2.5}" ${o.putus ? 'stroke-dasharray="7 6"' : ''}/>`;
  const garis = (a, b, o = {}) => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${o.warna || C.garis}" stroke-width="${o.tebal || 2.5}" stroke-linecap="round" ${o.putus ? 'stroke-dasharray="7 6"' : ''}/>`;
  const titik = (p, o = {}) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${o.r || 5}" fill="${o.warna || C.putih}"/>`;
  const teks = (p, s, o = {}) => `<text x="${f(p[0])}" y="${f(p[1])}" fill="${o.warna || C.putih}" font-size="${o.ukuran || 20}" font-weight="${o.tebal || 600}" text-anchor="${o.jangkar || 'middle'}" dominant-baseline="middle">${s}</text>`;
  // busur dari sudut a ke b (berlawanan jarum jam)
  function busur(cx, cy, r, a, b, o = {}){
    let span = b - a; while (span < 0) span += 360;
    const p1 = pt(cx, cy, r, a), p2 = pt(cx, cy, r, b);
    const large = span > 180 ? 1 : 0;
    return `<path d="M${f(p1[0])} ${f(p1[1])} A${f(r)} ${f(r)} 0 ${large} 0 ${f(p2[0])} ${f(p2[1])}" fill="none" stroke="${o.warna || C.kuning}" stroke-width="${o.tebal || 6}" stroke-linecap="round" ${o.putus ? 'stroke-dasharray="7 6"' : ''}/>`;
  }
  function juring(cx, cy, r, a, b, isi){
    let span = b - a; while (span < 0) span += 360;
    const p1 = pt(cx, cy, r, a), p2 = pt(cx, cy, r, b);
    return `<path d="M${f(cx)} ${f(cy)} L${f(p1[0])} ${f(p1[1])} A${f(r)} ${f(r)} 0 ${span > 180 ? 1 : 0} 0 ${f(p2[0])} ${f(p2[1])} Z" fill="${isi || C.isiK}" stroke="none"/>`;
  }
  function tembereng(cx, cy, r, a, b, isi){
    let span = b - a; while (span < 0) span += 360;
    const p1 = pt(cx, cy, r, a), p2 = pt(cx, cy, r, b);
    return `<path d="M${f(p1[0])} ${f(p1[1])} A${f(r)} ${f(r)} 0 ${span > 180 ? 1 : 0} 0 ${f(p2[0])} ${f(p2[1])} Z" fill="${isi || C.isiO}" stroke="none"/>`;
  }
  // penanda sudut di titik V antara arah ke A dan ke B
  function sudut(V, A, B, rr, label, o = {}){
    const a1 = Math.atan2(-(A[1] - V[1]), A[0] - V[0]) * 180 / Math.PI;
    const a2 = Math.atan2(-(B[1] - V[1]), B[0] - V[0]) * 180 / Math.PI;
    let s = a1, e = a2, span = e - s; while (span < 0) span += 360;
    if (span > 180){ s = a2; e = a1; span = 360 - span; }
    let out = busur(V[0], V[1], rr, s, e, { warna: o.warna || C.oranye, tebal: 3 });
    if (label){ const mid = s + span / 2; out += teks(pt(V[0], V[1], rr + (o.jarak || 22), mid), label, { warna: o.warna || C.oranye, ukuran: o.ukuran || 19 }); }
    return out;
  }
  function siku(V, A, B, s = 13, warna = C.hijau){
    const u = norm([A[0] - V[0], A[1] - V[1]]), v = norm([B[0] - V[0], B[1] - V[1]]);
    const p1 = [V[0] + u[0] * s, V[1] + u[1] * s], p3 = [V[0] + v[0] * s, V[1] + v[1] * s];
    const p2 = [p1[0] + v[0] * s, p1[1] + v[1] * s];
    return `<path d="M${f(p1[0])} ${f(p1[1])} L${f(p2[0])} ${f(p2[1])} L${f(p3[0])} ${f(p3[1])}" fill="none" stroke="${warna}" stroke-width="2.2"/>`;
  }
  function norm(v){ const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; }
  function tengah(a, b, t = .5){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function penanda(p, n, aktif){
    return `<g class="penanda ${aktif ? 'aktif' : ''}" data-slot="${n}"><circle cx="${f(p[0])}" cy="${f(p[1])}" r="15" fill="${aktif ? C.kuning : '#1C3A4B'}" stroke="${C.kuning}" stroke-width="2.5"/>${teks([p[0], p[1] + 1], n, { ukuran: 16, tebal: 700, warna: aktif ? '#1C3A4B' : C.kuning })}</g>`;
  }
  // garis singgung dua lingkaran (y ke atas pada sudut beta)
  function singgungLuar(c1, R, c2, r, atas = true){
    const d = c2[0] - c1[0]; const b = Math.acos((R - r) / d) * 180 / Math.PI * (atas ? 1 : -1);
    return [pt(c1[0], c1[1], R, b), pt(c2[0], c2[1], r, b), b];
  }
  function singgungDalam(c1, R, c2, r, atas = true){
    const d = c2[0] - c1[0]; const b = Math.acos((R + r) / d) * 180 / Math.PI * (atas ? 1 : -1);
    return [pt(c1[0], c1[1], R, b), pt(c2[0], c2[1], r, b + 180), b];
  }

  function sudutDi(P, A, B){

function sabukUmum(c1, R, c2, r){
  const dx = c2[0] - c1[0], dy = c2[1] - c1[1], d = Math.hypot(dx, dy), th = Math.atan2(dy, dx), b = Math.acos((R - r) / d);
  const n1 = [Math.cos(th + b), Math.sin(th + b)], n2 = [Math.cos(th - b), Math.sin(th - b)];
  return [[c1[0] + R * n1[0], c1[1] + R * n1[1]], [c2[0] + r * n1[0], c2[1] + r * n1[1]], [c1[0] + R * n2[0], c1[1] + R * n2[1]], [c2[0] + r * n2[0], c2[1] + r * n2[1]]];
}
function singgungTitikUmum(W, R, P){
  const dx = P[0] - W[0], dy = P[1] - W[1], d = Math.hypot(dx, dy), th = Math.atan2(dy, dx), b = Math.acos(R / d);
  return [[W[0] + R * Math.cos(th + b), W[1] + R * Math.sin(th + b)], [W[0] + R * Math.cos(th - b), W[1] + R * Math.sin(th - b)]];
}

const $ = id => document.getElementById(id);
function h(tag, at, ...anak){
  const el = document.createElement(tag);
  if (at) for (const k in at){
    const v = at[k];
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const a of anak.flat()){ if (a == null || a === false) continue; el.appendChild(typeof a === 'string' || typeof a === 'number' ? document.createTextNode(String(a)) : a); }
  return el;
}
const acak = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pilihAcak = n => Math.floor(Math.random() * n);

/* ---------- Audio (sintesis) ---------- */
const Audio_ = (() => {
  let ctx = null, master = null, musikG = null, bisu = true, timer = null, langkah = 0;
  const nada = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];
  const pola = [0, 2, 4, 2, 5, 4, 2, 1, 0, 3, 4, 6, 5, 3, 2, 1];
  function init(){
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){ ctx = null; return; }
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    musikG = ctx.createGain(); musikG.gain.value = .22; musikG.connect(master);
  }
  function bunyi(fr, dur, tipe = 'sine', vol = .3, tuju){
    if (!ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipe; o.frequency.setValueAtTime(fr, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
    o.connect(g); g.connect(tuju || master); o.start(t); o.stop(t + dur + .05);
  }
  function derau(dur, vol = .2){
    if (!ctx) return;
    const n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), g = ctx.createGain(), fl = ctx.createBiquadFilter();
    fl.type = 'bandpass'; fl.frequency.value = 3200; s.buffer = buf; g.gain.value = vol;
    s.connect(fl); fl.connect(g); g.connect(master); s.start();
  }
  function musik(){
    if (!ctx || timer) return;
    timer = setInterval(() => {
      const f = nada[pola[langkah % pola.length]];
      bunyi(f, .9, 'triangle', .12, musikG);
      if (langkah % 4 === 0) bunyi(f / 2, 1.6, 'sine', .1, musikG);
      langkah++;
    }, 420);
  }
  function mulai(){
    init(); if (!ctx) return;
    musik();
    // mulai dalam keadaan bisu, lalu coba nyalakan setelah pemutaran berjalan
    ctx.resume().then(() => { if (ctx.state === 'running'){ bisu = false; master.gain.setTargetAtTime(.55, ctx.currentTime, .4); segarkanIkon(); } }).catch(() => {});
  }
  function alih(){
    init(); if (!ctx) return;
    bisu = !bisu;
    ctx.resume().catch(() => {});
    master.gain.setTargetAtTime(bisu ? 0 : .55, ctx.currentTime, .1);
    segarkanIkon();
  }
  function segarkanIkon(){ document.querySelectorAll('.btnSuara').forEach(b => { b.textContent = bisu ? '🔇' : '🔊'; b.setAttribute('aria-label', bisu ? 'Nyalakan suara' : 'Matikan suara'); }); }
  return {
    mulai, alih, get bisu(){ return bisu; },
    klik: () => bunyi(660, .08, 'square', .06),
    benar: () => { bunyi(523, .18, 'triangle', .25); setTimeout(() => bunyi(784, .3, 'triangle', .25), 110); },
    coba: () => bunyi(233, .25, 'sine', .2),
    potong: () => { derau(.35, .25); bunyi(140, .3, 'sawtooth', .08); },
    menang: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bunyi(f, .35, 'triangle', .22), i * 140))
  };
})();
const tombolSuara = () => h('button', { class: 'ikon btnSuara', 'aria-label': 'Suara', onclick: () => Audio_.alih() }, Audio_.bisu ? '🔇' : '🔊');
function layarPenuh(){ const el = document.documentElement; if (!document.fullscreenElement){ (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } else { (document.exitFullscreen || (() => {})).call(document); } }
const tombolPenuh = () => h('button', { class: 'ikon', 'aria-label': 'Layar penuh', onclick: layarPenuh }, '⛶');

/* ---------- Umpan balik ---------- */
function tampilUmpan(el, jenis, html){ el.className = `umpan on ${jenis}`; el.innerHTML = html; }

/* ---------- Interaksi ---------- */
function pasang(q, area, meja){
  const j = q.jenis;
  if (j === 'angka') return iAngka(q, area, meja);
  if (j === 'pg') return iPG(q, area, meja);
  if (j === 'label') return iLabel(q, area, meja);
  if (j === 'urut') return iUrut(q, area, meja);
  if (j === 'jodoh') return iJodoh(q, area, meja);
  if (j === 'geser') return iGeser(q, area, meja);
}
function gambarMeja(q, meja){ if (q.gambar){ const g = q.gambar(); if (typeof g === 'string') meja.innerHTML = g; } }

function iAngka(q, area, meja){
  gambarMeja(q, meja);
  const inp = h('input', { type: 'text', inputmode: 'text', autocomplete: 'off', 'aria-label': 'Jawaban', placeholder: q.pi ? 'contoh: 14π atau 43,98' : 'tulis jawabanmu' });
  const baca = h('div', { class: 'baca', 'aria-live': 'polite' });
  const segar = () => { const v = inp.value.trim(); if (!v){ baca.textContent = ''; return; }
    try { const x = M.parse(v); baca.textContent = `Terbaca: ${M.normal(v).replace(/\*/g, '×').replace(/\./g, ',')} ≈ ${M.koma(x, 2)}`; } catch (e){ baca.textContent = 'Penulisan belum terbaca.'; } };
  inp.addEventListener('input', segar);
  const sisip = s => { const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a; inp.value = inp.value.slice(0, a) + s + inp.value.slice(b); inp.focus(); inp.setSelectionRange(a + s.length, a + s.length); segar(); };
  area.append(h('div', { class: 'masukan' }, inp, h('span', { class: 'sat' }, q.satuan || '')),
    h('div', { class: 'papan' }, ['π', '√', '(', ')', '+', '−', ','].map(s => h('button', { type: 'button', onclick: () => sisip(s === '−' ? '-' : s) }, s)),
      h('button', { type: 'button', 'aria-label': 'Hapus', onclick: () => { inp.value = inp.value.slice(0, -1); inp.focus(); segar(); } }, '⌫')), baca);
  setTimeout(() => inp.focus(), 40);
  let ukurEl = null;
  return {
    input: inp,
    periksa(){
      const v = inp.value.trim();
      if (!v) return { abaikan: true, pesan: 'Tulis jawabanmu dulu di kotak jawaban.' };
      let x; try { x = M.parse(v); } catch (e){ return { abaikan: true, pesan: 'Jawaban belum terbaca. Contoh penulisan: 15, 14π, 12√3 + 20π, atau 43,98.' }; }
      if (M.cocok(x, q.nilai)){ if (ukurEl) ukurEl.classList.remove('on'); return { benar: true }; }
      let kode = null; for (const [nilai, k] of (q.mis || [])) if (k && M.cocok(x, nilai)){ kode = k; break; }
      // alat ukur: tampilkan akibat fisik potongan
      if (q.ukur){

    h('div', { style: 'display:flex;gap:1cqw;margin-top:1.6cqw;flex-wrap:wrap' },
      h('button', { class: 'tb', onclick: pratinjauA4 }, 'Pratinjau cetak A4'),
      h('button', { class: 'tb gelap', onclick: () => { if (confirm('Mulai permainan baru dengan angka pesanan yang berbeda? Kemajuan sekarang akan dihapus.')){ const n = S.nama, k = S.kelas; S = stateBaru(); S.nama = n; S.kelas = k; renderBengkel(); tampil('L-bengkel'); } } }, 'Main lagi dengan angka baru')));
  L.appendChild(h('div', { class: 'gulir' }, lembar));
}
function langkahBerikut(R){
  if (R.misList.length){ const [k] = R.misList[0]; const peta = { M1: 1, M2: 2, M3: 2, M4: 3, M5: 4, M6: 4, M7: 6, M8: 7, M9: 5, M10: 2 }; return `Ulangi order No. ${String(peta[k]).padStart(2, '0')} dan baca kembali materi pelatihannya. Fokus pada: ${MIS[k].arah}`; }
  const min = R.tk.reduce((m, t, i) => t.bintang < R.tk[m].bintang ? i : m, 0);
  if (R.tk[min].bintang < 3) return `Ulangi order ${noOrder(min)} (${R.tk[min].judul}) untuk meraih tiga bintang.`;
  return 'Semua tiket tiga bintang. Tantang dirimu dengan "Main lagi dengan angka baru".';
}

  $('a4').innerHTML = `<h1>Laporan Kerja Bengkel — Potong Pas</h1><div style="color:#4E5D68">Gim edukasi Matematika Fase F · Bab Lingkaran</div>

  <h2>Predikat: ${R.pred[0]}</h2><p>${R.pred[1]} Total ${R.bintang} dari 21 bintang; ${R.salah} percobaan belum pas tercatat; kunci jawaban dipakai pada ${R.kunci} langkah.</p>
  <h2>Rincian pesanan</h2><table><tr><th>Order</th><th>Materi</th><th>Percobaan belum pas</th><th>Kunci dipakai</th><th>Bintang</th></tr>
  ${S.tiket.map((t, i) => `<tr><td>${i + 1}. ${t.judul}</td><td>${t.materi}</td><td>${t.salah}</td><td>${t.kunciDipakai} dari ${t.langkah}</td><td>${'★'.repeat(t.bintang)}${'☆'.repeat(3 - t.bintang)}</td></tr>`).join('')}</table>
  <h2>Yang sudah kuat</h2><p>${R.kuat.length ? 'Tepat sejak percobaan pertama pada: ' + R.kuat.join('; ') + '.' : 'Seluruh pesanan tuntas; setiap percobaan yang belum pas sudah diperbaiki.'}</p>
  <h2>Arah latihan</h2>${R.misList.length ? '<ul>' + R.misList.map(([k, n]) => `<li><b>${MIS[k].nama}</b> (muncul ${n}×). ${MIS[k].arah}</li>`).join('') + '</ul>' : '<p>Tidak ada pola kekeliruan yang tercatat.</p>'}
  <h2>Langkah berikutnya</h2><p>${langkahBerikut(R)}</p>
  <div style="margin-top:28pt;display:grid;grid-template-columns:1fr 1fr;gap:20pt;text-align:center"><div>Murid<br><br><br><br>${esc(S.nama)}</div><div>Guru Matematika<br><br><br><br>(................................)</div></div>`;
  $('cetak').classList.add('on');
}
$('btnCetak').onclick = () => window.print();
