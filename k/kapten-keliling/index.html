<meta name="description" content="Komik matematika bergaya pahlawan super dengan musik latar. Si Penghapus menghapus pagar Kota Garis, dan murid membantu Kapten Keliling menghitung panjang tepi agar pagar bisa dipasang lagi. Apersepsi lari mengelilingi lapangan, lalu lima episode: semut menyusuri tepi kebun, mengukur dengan batang korek dan sentimeter, animasi Buka Sisi yang meluruskan sisi bangun menjadi satu garis, penggeser ukuran persegi panjang dan segi banyak, serta bangun gabungan dengan sisi dalam yang tidak dihitung. Dilengkapi Lab Papan Petak, Misi Pahlawan 8 soal (pilihan ganda, klik sisi, seret angka, isian, mengurutkan), Ujian Pahlawan 10 soal, dan rapor berlencana.">
