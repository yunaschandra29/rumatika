<title>Kapten Ubin: Misi Lantai Kota Garis · Rumatika</title>
<meta name="description" content="Lanjutan komik Kapten Keliling dengan musik latar. Si Penghapus menghapus ubin lantai Kota Garis, dan murid membantu Kapten Ubin menghitung luas agar ubin bisa dipasang lagi. Apersepsi menutup dua tikar dengan ubin, lalu lima episode: tepi dan daerah, menutup meja dengan buku dan kartu, persegi satuan, ubin dipasang baris demi baris hingga muncul rumus panjang × lebar, persegi panjang dipotong diagonal untuk luas segitiga, bangun gabungan dengan cara dibagi dan cara dikurangi, serta 12 ubin yang disusun ulang untuk membandingkan keliling dan luas. Dilengkapi Lab Ubin Ajaib, Misi Pahlawan 8 soal (pilihan ganda, mewarnai petak, seret angka, isian, mengurutkan), Ujian Pahlawan 10 soal, dan rapor berlencana. Murid bisa memilih tokoh putra atau putri.">
