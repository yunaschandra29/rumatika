<title>Kalkir &amp; Cermin · Rumatika</title>
<meta name="description" content="Buku sketsa matematika bernuansa kertas berpetak, goresan pensil bersuara, dan musik latar. Pemanasan tiga langkah dengan ilustrasi sketsa: kegunaan transformasi di sekitar murid, trik kertas kalkir untuk menggeser parabola, dan pertanyaan pemantik tentang membalik grafik. Empat materi (pergeseran, pencerminan, peregangan dan pemampatan, pemodelan) dengan grafik yang digambar pensil langkah demi langkah, 12 latihan dengan tiga kesempatan, empat lab sketsa (Geser Kalkir, Cermin Dua Sumbu, Karet Grafik, Pas Data), tiga kasus terapan (suhu °F, lompatan karakter gim, gerbang lengkung), dan asesmen 12 soal. Ditutup gim Meja Kalkir: murid menyusun urutan kartu transformasi sampai kertas kalkir berimpit dengan pesanan, lalu menuliskan fungsinya. Dilengkapi laporan belajar A4.">
