<meta name="description" content="Menjadi juragan stok koperasi siswa dua cabang yang menata data barang dengan matriks. Lima modul (jenis matriks dan transpos, kesamaan dua matriks, penjumlahan dan pengurangan, perkalian, determinan dan invers) dengan soal Cek Paham, tiga lab maya (Rak Susun, Mesin Kali yang menampilkan baris kali kolom langkah demi langkah, dan Gepeng atau Tidak? yang menggambarkan determinan sebagai luas jajargenjang), tiga kasus gudang, 15 latihan dengan tiga kesempatan, dan asesmen 12 soal. Menu berbentuk drum putar dengan tokoh yang menjelaskan isi tiap bagian. Dilengkapi laporan belajar A4.">
